// SKYHAUL — deterministic simulation core. No DOM, no audio.
// Loaded as a classic script in the browser (window.SKY) and via require() in Node tests.
(function (root) {
  "use strict";

  const CFG = {
    W: 320,
    H: 240,
    dt: 1 / 60,
    groundY: 224, // feet of walking humans
    topY: 36, // highest lander centre
    // Lander
    landerSpeed: 104,
    landerSlowPerBody: 0.1, // speed / (1 + k·n)
    landerAccel: 14, // velocity response (1/s)
    landerHalfW: 6,
    landerHalfH: 4,
    hover: 4, // the lander hovers at least this far above the ground (its hook still reaches)
    // Tractor chain
    hookLen: 7, // lander → hook
    linkLen: 10, // body → body
    gravity: 320,
    damping: 0.985,
    iterations: 8,
    grabR: 7, // tip ↔ human centre distance that attaches
    regrabDelay: 0.35,
    cutRecoil: 2.2, // px/tick of upward snap given to the chain end left hanging after a cut
    // Humans
    walkSpeed: 7,
    fallSpeed: 24,
    // Mothership / delivery
    shipY: 24,
    shipHalfW: 22,
    hatchHalfW: 10,
    shipSpeed: 18,
    reelStep: 0.075, // seconds per body reeled in
    scoreUnit: 100, // delivery of n bodies = unit · n²
    // Defender (the AI "hero")
    defSpeed: 74,
    defAccel: 150,
    defClimb: 32,
    defStoop: 1, // descending speed as a multiple of climb
    defTurnCooldown: 1.2,
    defPassMargin: 44, // lander this far behind → turn around
    defFireRange: 230,
    defRowWindow: 7, // |Δy| to lander that triggers a shot
    defFireCool: 2.0,

    defTelegraph: 0.4,
    defRescueRange: 150,
    defCommitRange: 120,
    defPointBlank: 44, // inside this range (without a pass) it holds its altitude
    defCalm: 0.9, // after a rescue the Defender flies flat and holds fire
    defHalfW: 10,
    defHalfH: 3,
    laserSpeed: 430,
    laserLen: 110,
    laserHalfH: 2.5,
    grazeMargin: 6, // px beyond a hit that still counts as a near miss (feedback only)
    wrapPad: 40,
    // Pressure
    alertTime: 60, // fallback HOT time (each stage sets its own, see STAGES)
    hotPerTour: 10, // later tours have more captives, so a little more time
    // HOT pilot multipliers
    hotSpeed: 1.7, // speed (and acceleration)
    hotClimb: 2.0,
    hotFire: 0.5, // × fire interval
    // Round flow
    readyTime: 1.6,
    dyingTime: 1.7,
    clearTime: 2.6,
    spawnInvuln: 2.0,
    lives: 3,
    extendFirst: 10000,
    extendEvery: 30000,
    humansBase: 8,
    humansStep: 2,
    humansMax: 16,
    roundBonus: 1000, // × (tour + 1) on each round clear
    timeBonusPerSec: 50,
    finalRound: 8, // clearing this round (and its bonus stage) completes the mission
    livesBonus: 5000, // per ship left at mission complete
    completeTime: 7, // × (tour + 1) per whole second left on the HOT fuse at a round clear
    // Bonus stage after each planet: no enemies, captives parachute down, catch them before time.
    bonusTime: 24,
    bonusDrop: 1.3, // seconds between parachutists
    bonusCount: 12, // + 2 per tour
    bonusPerfect: 5000, // × (tour + 1) for delivering every one
    // Heavies: count double in the haul, drag the lander twice as much, hang on a longer link,
    // and drop like stones when cut.
    heavyLink: 14,
    heavyFall: 52,
    // Rescuer: an unarmed hero craft. It plucks the lowest captive off a hanging chain (or a
    // falling one) and flies it back to the ground far from the lander. A carried captive can be
    // hooked back with the chain tip.
    rescuerCarrySpeed: 34,
    rescuerGrabR: 7,
    rescuerPatrolY: 96,
    rescuerMinChain: 2, // only chains of this many bodies (or more) are worth a pass
    // Ground turrets: fire straight up at a lander passing over them. The beam stops at the first
    // thing it meets — so a hanging chain shields the lander, at the cost of its lowest captives.
    turretSense: 26, // |Δx| of the lander that wakes a turret
    turretCharge: 0.6,
    turretCool: 2.6,
    turretBeam: 0.22, // how long the column is drawn
    turretBeamHalfW: 2,
    turretLanderHalfW: 4, // the hull's core: a chain hanging straight beneath it always covers it
    // Bomber: lays still mines across the sky.
    bomberSpeed: 34,
    bomberHalfW: 8,
    bomberHalfH: 4,
    bomberDrop: 2.0, // seconds between mines while on screen
    mineMax: 5,
    mineLife: 12,
    mineArm: 0.6, // harmless (and drawn hollow) until armed
    mineR: 3, // chain / hull contact radius
    mineSafeR: 34, // never laid this close to the lander
  };

  // The campaign: four planets (terrain and colour) of two rounds each, then the tour repeats at
  // a higher rank. Each round has its own personality — a mix of the existing pieces rather than
  // an ever-growing pile — with a Defender-only duel (ACE) as the spike and bonus stages as the
  // breathers between planets.
  const PLANETS = [
    { name: "VERDA", terrain: "flat" },
    { name: "OCHRE", terrain: "hills" },
    { name: "CINDER", terrain: "mesas" },
    { name: "VOID", terrain: "canyons" },
  ];
  const ROUNDS_PER_PLANET = 2;
  // def: Defender multipliers (speed, climb, fire = interval). rescuer: speed / rest.
  // hot: seconds of play before the Defender goes HOT — about 1.5 × a strong player's clear time
  // for that round, so it punishes a slow round rather than being part of every round.
  // bomber: mine cap / drop interval. turrets: x positions as fractions of the screen width.
  const PLAIN = { speed: 1, climb: 1, fire: 1 };
  // The ace pilot: round 6's duel, and back for the final round.
  const ACE_DEF = { speed: 1.5, climb: 1.7, fire: 0.65 };
  const STAGES = [
    { tag: "", def: { speed: 1, climb: 1, fire: 1.6 }, heavyEvery: 0, rescuer: null, bomber: null, turrets: [], shutter: null, hot: 50 },
    { tag: "", def: PLAIN, heavyEvery: 0, rescuer: { speed: 42, rest: 5 }, bomber: null, turrets: [], shutter: null, hot: 55 },
    { tag: "", def: PLAIN, heavyEvery: 4, rescuer: { speed: 44, rest: 5 }, bomber: null, turrets: [], shutter: null, hot: 60 },
    { tag: "MINES", def: PLAIN, heavyEvery: 4, rescuer: null, bomber: { max: 3, drop: 2.8 }, turrets: [], shutter: null, hot: 85 },
    { tag: "GUNS", def: PLAIN, heavyEvery: 5, rescuer: null, bomber: null, turrets: [0.25, 0.5, 0.75], shutter: { open: 3.2, shut: 1.6 }, hot: 85 },
    { tag: "ACE", def: ACE_DEF, heavyEvery: 0, rescuer: null, bomber: null, turrets: [], shutter: null, hot: 85 },
    { tag: "CROSSFIRE", def: PLAIN, heavyEvery: 4, rescuer: null, bomber: { max: 3, drop: 2.8 }, turrets: [0.2, 0.52, 0.8], shutter: { open: 2.8, shut: 1.8 }, hot: 115 },
    { tag: "SIEGE", def: ACE_DEF, heavyEvery: 0, rescuer: { speed: 50, rest: 5 }, bomber: { max: 3, drop: 2.8 }, turrets: [0.2, 0.8], shutter: null, hot: 115 },
  ];

  function roundRules(round) {
    const k = Math.floor((round - 1) / ROUNDS_PER_PLANET);
    const p = PLANETS[k % PLANETS.length];
    const st = STAGES[(round - 1) % STAGES.length];
    return {
      planet: k % PLANETS.length,
      planetName: p.name,
      stage: (round - 1) % STAGES.length,
      tag: st.tag,
      tour: Math.floor(k / PLANETS.length),
      firstOfPlanet: (round - 1) % ROUNDS_PER_PLANET === 0,
      lastOfPlanet: (round - 1) % ROUNDS_PER_PLANET === ROUNDS_PER_PLANET - 1,
      terrain: p.terrain,
      heavyEvery: st.heavyEvery,
      bomber: st.bomber || false,
      shutter: st.shutter,
      rescuer: st.rescuer,
      turrets: st.turrets,
      def: st.def,
      hotTime: st.hot + CFG.hotPerTour * Math.floor(k / PLANETS.length),
    };
  }

  // Terrain as a height map: ground[x] is the y of the surface (feet level) at column x.
  function buildGround(kind, rand) {
    const W = CFG.W;
    const G = new Array(W + 1);
    const base = CFG.groundY;
    for (let x = 0; x <= W; x++) G[x] = base;
    if (kind === "hills") {
      const ph = rand() * 6.28;
      // Broad, shallow swells: they hide a lander from a long shot, not from a pilot overhead.
      for (let x = 0; x <= W; x++) G[x] = Math.round(base - 5 - 5 * Math.sin((x / W) * 6.28 * 1.5 + ph));
    } else if (kind === "mesas") {
      // Flat-topped plateaus with steep walls: shelter from level shots on the far side.
      // Two plateaus with wide open ground between and beside them.
      const tops = [
        [70 + rand() * 20, 48],
        [230 + rand() * 20, 48],
      ];
      for (const [c, w] of tops)
        for (let x = 0; x <= W; x++) {
          const d = Math.abs(x - c) - w / 2;
          const h = d <= 0 ? 24 : Math.max(0, 24 - d * 3);
          G[x] = Math.min(G[x], Math.round(base - h));
        }
    } else if (kind === "canyons") {
      // A high plain cut by two deep canyons.
      // A high plain cut by one wide canyon, open enough for the Defender to drop into.
      const cs = [150 + rand() * 20];
      for (let x = 0; x <= W; x++) {
        let h = 30;
        for (const c of cs) {
          const d = Math.abs(x - c);
          if (d < 86) h = Math.min(h, Math.max(0, (d - 74) * 2.5));
        }
        G[x] = Math.round(base - h);
      }
    }
    return G;
  }

  // Local steepness (px of rise per px) and which way is downhill.
  function slopeAt(g, x) {
    const a = groundAt(g, x - 1);
    const b = groundAt(g, x + 1);
    return { steep: Math.abs(b - a) / 2, down: b > a ? 1 : -1 };
  }
  // Nobody stands on a cliff: slide a position down to the nearest foothold.
  function footholdX(g, x) {
    for (let k = 0; k < 80 && slopeAt(g, x).steep > 2; k++) x += slopeAt(g, x).down;
    return x;
  }

  function groundAt(g, x) {
    const i = Math.max(0, Math.min(CFG.W, Math.round(x)));
    return g.ground[i];
  }
  // Highest surface under a horizontal span (for hulls wider than one column).
  function groundUnder(g, x0, x1) {
    // Off-screen, the terrain continues as its edge column.
    const a = clamp(Math.floor(x0), 0, CFG.W);
    const b = clamp(Math.ceil(x1), 0, CFG.W);
    let m = 1e9;
    for (let x = a; x <= b; x++) m = Math.min(m, g.ground[x]);
    return m;
  }

  function rng(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

  // Defender rank. Within a tour the challenge comes from each planet's new system, so the pilot
  // only sharpens slightly per planet; each completed tour sharpens it properly.
  function roundScale(round) {
    const k = Math.floor((round - 1) / ROUNDS_PER_PLANET);
    const rank = Math.min(12, (k % PLANETS.length) + 4 * Math.floor(k / PLANETS.length));
    return {
      speed: 1 + 0.04 * rank,
      cool: 1 / (1 + 0.07 * rank),
      climb: 1 + 0.06 * rank,
    };
  }

  function createGame(seed, opts) {
    const g = {
      seed: seed >>> 0,
      rand: rng(seed || 1),
      opts: Object.assign({}, opts || {}),
      t: 0,
      round: 0,
      score: 0,
      lives: CFG.lives,
      nextExtend: CFG.extendFirst,
      phase: "ready",
      phaseT: 0,
      roundT: 0,
      alert: false,
      events: [],
      nextId: 1,
      humans: [], // {id, x, y, state: 'walk'|'held'|'fall', dir, vy}
      lander: null,
      chain: [], // nodes {x,y,px,py,hid} — chain[0] is the hook (hid = 0)
      def: null,
      lasers: [],
      mines: [],
      bomber: null,
      rescuer: null,
      turrets: [],
      rules: null,
      ship: { x: CFG.W / 2, dir: 1, open: true, cycle: 0 },
      ground: null,
      reel: null, // {t, total, gained}
      bonus: null, // bonus stage state, or null in a normal round
      stats: { delivered: 0, deliveries: [], cuts: 0, deaths: 0, rescues: 0, maxChain: 0, recatches: 0, mineCuts: 0, covered: 0, snatches: 0, stealBacks: 0, grazes: 0, deathBy: {} },
      gameOver: false,
    };
    startRound(g, 1);
    return g;
  }

  function startRound(g, round) {
    g.round = round;
    g.roundT = 0;
    g.alert = false;
    g.humans = [];
    g.rules = Object.assign(roundRules(round), g.opts.rules || {});
    g.ground = buildGround(g.rules.terrain, g.rand);
    g.ship.open = true;
    g.ship.cycle = 0;
    // Round length stays steady within a tour (8, then 10, on each planet); each tour adds two.
    const n = Math.min(CFG.humansMax, CFG.humansBase + CFG.humansStep * (((round - 1) % ROUNDS_PER_PLANET) + g.rules.tour));
    const every = g.rules.heavyEvery;
    for (let i = 0; i < n; i++) {
      // Spread along the ground with jitter so the first sweep is readable.
      let x = 20 + ((i + 0.5) / n) * (CFG.W - 40) + (g.rand() - 0.5) * 14;
      const kind = every > 0 && i % every === Math.floor(every / 2) ? "heavy" : "walker";
      x = footholdX(g, x);
      g.humans.push({ id: g.nextId++, kind, w: kind === "heavy" ? 2 : 1, x, y: groundAt(g, x) - 3, state: "walk", dir: g.rand() < 0.5 ? -1 : 1, vy: 0, walkT: g.rand() * 3 });
    }
    g.mines = [];
    g.bomber = g.rules.bomber ? newBomber(g, 1) : null;
    g.rescuer = g.rules.rescuer ? newRescuer(g) : null;
    g.turrets = (g.rules.turrets || []).map((f, i) => {
      const x = footholdX(g, f * CFG.W);
      return { x, y: groundAt(g, x), cool: 1.2 + i * 0.7, charge: 0, beam: 0, top: 0 };
    });
    g.ship.x = CFG.W / 2;
    g.lasers = [];
    spawnLander(g);
    resetDefender(g);
    g.phase = "ready";
    g.phaseT = CFG.readyTime;
    g.events.push({ t: "round", round, planet: g.rules.planetName, first: g.rules.firstOfPlanet });
  }

  // Mission complete: every remaining ship (the one flying included) is worth a bonus.
  function completeGame(g) {
    const livesBonus = g.lives * CFG.livesBonus;
    g.cleared = true;
    g.complete = { lives: g.lives, livesBonus };
    g.humans = [];
    g.lasers = [];
    g.mines = [];
    g.bomber = null;
    g.rescuer = null;
    g.turrets = [];
    g.def.x = -CFG.wrapPad;
    g.def.vx = 0;
    g.lander.alive = false; // the lander has gone home; nothing flies during the ending
    g.chain = [];
    addScore(g, livesBonus);
    g.phase = "complete";
    g.phaseT = CFG.completeTime;
    g.events.push({ t: "complete", lives: g.lives, livesBonus });
  }

  function startBonus(g) {
    const tour = g.rules.tour;
    g.bonus = { t: CFG.bonusTime, total: CFG.bonusCount + 2 * tour, spawned: 0, drop: 0.4, delivered: 0 };
    g.rules = Object.assign({}, g.rules, { shutter: null, bomber: false });
    g.humans = [];
    g.mines = [];
    g.bomber = null;
    g.rescuer = null;
    g.turrets = [];
    g.lasers = [];
    g.alert = false;
    g.roundT = 0;
    g.ship.open = true;
    spawnLander(g);
    resetDefender(g);
    g.def.x = -CFG.wrapPad; // grounded for the bonus stage
    g.def.vx = 0;
    g.phase = "ready";
    g.phaseT = CFG.readyTime;
    g.events.push({ t: "bonusStart", total: g.bonus.total });
  }

  function updateBonus(g, dt) {
    const b = g.bonus;
    b.t = Math.max(0, b.t - dt);
    b.drop -= dt;
    if (b.drop <= 0 && b.spawned < b.total && b.t > 0) {
      b.drop = CFG.bonusDrop;
      const x = 24 + g.rand() * (CFG.W - 48);
      const heavy = b.spawned % 5 === 4;
      g.humans.push({ id: g.nextId++, kind: heavy ? "heavy" : "walker", w: heavy ? 2 : 1, x, y: CFG.topY + 4, state: "fall", dir: 1, vy: 0, walkT: 1 });
      b.spawned++;
      g.events.push({ t: "chute", x });
    }
    const allOut = b.spawned >= b.total && g.humans.length === 0;
    if (!g.reel && !g.lander.docked && (b.t <= 0 || allOut)) {
      const perfect = b.delivered >= b.total;
      const pts = perfect ? CFG.bonusPerfect * (g.rules.tour + 1) : 0;
      if (pts) addScore(g, pts);
      // Whoever was not hauled in drifts away with the stage.
      g.humans = [];
      g.chain = g.chain.slice(0, 1);
      g.phase = "clear";
      g.phaseT = CFG.clearTime + 0.6;
      g.events.push({ t: "bonusEnd", delivered: b.delivered, total: b.total, perfect, bonus: pts });
    }
  }

  function spawnLander(g) {
    const x = g.ship.x;
    const y = CFG.topY + 8;
    g.lander = { x, y, vx: 0, vy: 0, invuln: CFG.spawnInvuln, alive: true, docked: false };
    g.chain = [{ x, y: y + CFG.landerHalfH + CFG.hookLen, px: x, py: y + CFG.landerHalfH + CFG.hookLen, hid: 0 }];
  }

  function resetDefender(g) {
    // Enter from the side farther from the lander, low, heading inward.
    const fromLeft = g.lander.x > CFG.W / 2;
    const s = roundScale(g.round);
    g.def = {
      x: fromLeft ? -CFG.wrapPad + 4 : CFG.W + CFG.wrapPad - 4,
      y: 150 + g.rand() * 40,
      dir: fromLeft ? 1 : -1,
      vx: (fromLeft ? 1 : -1) * CFG.defSpeed * s.speed,
      turnCool: 0.8,
      cool: 1.2,
      tele: 0,
      mode: "hunt",
      targetId: 0,
      lock: null,
      calm: 0,
    };
  }

  function newRescuer(g) {
    return { x: CFG.W + CFG.wrapPad, y: CFG.rescuerPatrolY, vx: 0, vy: 0, dir: -1, mode: "patrol", carryId: 0, rest: 3, dropX: 0 };
  }

  function newBomber(g, dir) {
    return { x: dir > 0 ? -CFG.wrapPad : CFG.W + CFG.wrapPad, y: 70 + g.rand() * 80, dir, drop: 0.8 };
  }

  function humanById(g, id) {
    for (const h of g.humans) if (h.id === id) return h;
    return null;
  }

  const wrapW = () => CFG.W + CFG.wrapPad * 2;
  function wrapDelta(dx) {
    const w = wrapW();
    while (dx > w / 2) dx -= w;
    while (dx < -w / 2) dx += w;
    return dx;
  }

  function landerAnchor(g) {
    return { x: g.lander.x, y: g.lander.y + CFG.landerHalfH };
  }

  // ---------------------------------------------------------------- update
  function step(g, input) {
    const dt = CFG.dt;
    g.t += dt;
    input = input || { dx: 0, dy: 0 };
    if (g.phase === "over") return;
    if (g.phase === "complete") {
      g.phaseT -= dt;
      updateShip(g, dt);
      if (g.phaseT <= 0) {
        g.phase = "over";
        g.gameOver = true;
        g.events.push({ t: "gameover", cleared: true });
      }
      return;
    }

    if (g.phase === "ready") {
      g.phaseT -= dt;
      updateShip(g, dt);
      settleChainToLander(g);
      updateHumans(g, dt);
      if (g.phaseT <= 0) {
        g.phase = "play";
        g.events.push({ t: "go" });
      }
      return;
    }
    if (g.phase === "dying") {
      g.phaseT -= dt;
      updateHumans(g, dt);
      updateDefender(g, dt, true);
      updateLasers(g, dt, false);
      updateBomber(g, dt, false);
      updateRescuer(g, dt);
      updateTurrets(g, dt, false);
      if (g.phaseT <= 0) {
        if (g.lives <= 0) {
          g.phase = "over";
          g.gameOver = true;
          g.events.push({ t: "gameover" });
        } else {
          spawnLander(g);
          g.lasers = [];
          // Clear mines around the respawn point so the restart is fair.
          g.mines = g.mines.filter((m) => Math.hypot(m.x - g.lander.x, m.y - g.lander.y) > 50);
          resetDefender(g);
          g.phase = "ready";
          g.phaseT = CFG.readyTime * 0.7;
        }
      }
      return;
    }
    if (g.phase === "clear") {
      g.phaseT -= dt;
      updateShip(g, dt);
      if (g.phaseT <= 0) {
        // No bonus stage after the final round: the mission ends straight from SIEGE.
        const finalClear = g.round >= CFG.finalRound && !g.opts.endless;
        if (!g.bonus && g.rules.lastOfPlanet && !g.opts.noBonus && !finalClear) startBonus(g);
        else {
          g.bonus = null;
          // The campaign ends after the last round (and its bonus stage). `endless` keeps
          // touring, for simulations only.
          if (g.round >= CFG.finalRound && !g.opts.endless) completeGame(g);
          else startRound(g, g.round + 1);
        }
      }
      return;
    }

    // phase === "play"
    g.roundT += dt;
    if (!g.alert && !g.bonus) {
      // Last five seconds before HOT: one warning tick per second.
      const left = hotTime(g) - g.roundT;
      const prev = left + CFG.dt;
      if (left > 0 && left <= 5 && Math.ceil(left) !== Math.ceil(prev)) g.events.push({ t: "hotTick", left: Math.ceil(left) });
    }
    if (!g.alert && !g.bonus && g.roundT >= hotTime(g)) {
      g.alert = true;
      g.events.push({ t: "alert" });
    }
    updateShip(g, dt);
    updateLander(g, dt, input);
    updateChain(g, dt);
    updateHumans(g, dt);
    checkAttach(g);
    updateReel(g, dt);
    if (g.bonus) {
      updateBonus(g, dt);
      return;
    }
    updateDefender(g, dt, false);
    updateLasers(g, dt, true);
    updateBomber(g, dt, true);
    updateRescuer(g, dt);
    updateTurrets(g, dt, true);
    checkMines(g);
    checkDefenderBody(g);
    checkRoundClear(g);
  }

  function hotTime(g) {
    return (g.rules && g.rules.hotTime) || CFG.alertTime;
  }

  function updateShip(g, dt) {
    const s = g.ship;
    const sh = g.rules && g.rules.shutter;
    if (sh && g.phase === "play") {
      s.cycle += dt;
      const period = sh.open + sh.shut;
      const ph = s.cycle % period;
      const open = ph < sh.open;
      if (open !== s.open) {
        s.open = open;
        g.events.push({ t: open ? "hatchOpen" : "hatchShut", x: s.x });
      }
      s.warn = open && ph > sh.open - 0.6; // about to shut
    } else {
      s.open = true;
      s.warn = false;
    }
    s.x += s.dir * CFG.shipSpeed * dt;
    if (s.x > CFG.W - CFG.shipHalfW - 6) (s.x = CFG.W - CFG.shipHalfW - 6), (s.dir = -1);
    if (s.x < CFG.shipHalfW + 6) (s.x = CFG.shipHalfW + 6), (s.dir = 1);
  }

  function bodyCount(g) {
    return g.chain.length - 1;
  }

  // Haul weight: what the n² payout and the lander's drag count. A heavy counts 2.
  function chainWeight(g) {
    let w = 0;
    for (let i = 1; i < g.chain.length; i++) w += g.chain[i].w || 1;
    return w;
  }

  function linkLen(node) {
    return node.w > 1 ? CFG.heavyLink : CFG.linkLen;
  }

  function updateLander(g, dt, input) {
    const L = g.lander;
    if (L.invuln > 0) L.invuln -= dt;
    if (L.docked) {
      // Locked in the hatch while the chain reels in; the hatch carries the lander.
      L.x = g.ship.x;
      L.y = CFG.topY - 2;
      L.vx = L.vy = 0;
      return;
    }
    let dx = clamp(input.dx || 0, -1, 1);
    let dy = clamp(input.dy || 0, -1, 1);
    const m = Math.hypot(dx, dy);
    if (m > 1) (dx /= m), (dy /= m);
    const sp = CFG.landerSpeed / (1 + CFG.landerSlowPerBody * chainWeight(g));
    const k = 1 - Math.exp(-CFG.landerAccel * dt);
    L.vx += (dx * sp - L.vx) * k;
    L.vy += (dy * sp - L.vy) * k;
    const ox = L.x;
    L.x += L.vx * dt;
    // Terrain walls are solid sideways: moving into a wall stops the lander instead of lifting it.
    const hullFloor = (x) => groundUnder(g, x - CFG.landerHalfW, x + CFG.landerHalfW) - CFG.landerHalfH - CFG.hover;
    // (Gentle slopes, rising less than 1.5 px per px travelled, still lift it over.)
    const rise = L.y - hullFloor(L.x);
    if (rise > 1.5 * Math.abs(L.x - ox) + 0.5 && hullFloor(L.x) < hullFloor(ox)) {
      L.x = ox;
      L.vx = 0;
    }
    L.y += L.vy * dt;
    const minX = CFG.landerHalfW + 2;
    const maxX = CFG.W - CFG.landerHalfW - 2;
    if (L.x < minX) (L.x = minX), (L.vx = 0);
    if (L.x > maxX) (L.x = maxX), (L.vx = 0);
    // Terrain: the hull rides up a wall rather than passing through it.
    const maxY = hullFloor(L.x);
    if (L.y > maxY) (L.y = maxY), (L.vy = Math.min(0, L.vy));
    // Dock: reaching the hatch with at least one body aboard.
    const inHatch = Math.abs(L.x - g.ship.x) <= CFG.hatchHalfW && L.y <= CFG.topY + 1;
    if (L.y < CFG.topY) {
      if (inHatch && bodyCount(g) > 0 && !g.reel && g.ship.open) {
        L.docked = true;
        g.reel = { t: 0, gained: 0, n: 0, w: 0 };
        g.events.push({ t: "dock", n: bodyCount(g) });
      } else {
        L.y = CFG.topY;
        L.vy = Math.max(0, L.vy);
      }
    }
  }

  function updateChain(g, dt) {
    const a = landerAnchor(g);
    const gdt2 = CFG.gravity * dt * dt;
    for (const n of g.chain) {
      const vx = (n.x - n.px) * CFG.damping;
      const vy = (n.y - n.py) * CFG.damping;
      n.px = n.x;
      n.py = n.y;
      n.x += vx;
      n.y += vy + gdt2;
    }
    for (let it = 0; it < CFG.iterations; it++) {
      for (let i = 0; i < g.chain.length; i++) {
        const n = g.chain[i];
        const p = i === 0 ? a : g.chain[i - 1];
        const len = i === 0 ? CFG.hookLen : linkLen(n);
        const dx = n.x - p.x;
        const dy = n.y - p.y;
        const d = Math.hypot(dx, dy) || 1e-6;
        if (d > len) {
          const diff = (d - len) / d;
          if (i === 0) {
            n.x -= dx * diff;
            n.y -= dy * diff;
          } else {
            n.x -= dx * diff * 0.5;
            n.y -= dy * diff * 0.5;
            p.x += dx * diff * 0.5;
            p.y += dy * diff * 0.5;
          }
        }
      }
      for (const n of g.chain) {
        const floor = groundAt(g, n.x) - 3;
        if (n.y > floor) {
          n.y = floor;
          // Ground friction: bodies drag rather than skate.
          n.px += (n.x - n.px) * 0.4;
        }
        if (n.x < 2) n.x = 2;
        if (n.x > CFG.W - 2) n.x = CFG.W - 2;
      }
    }
    // Held humans follow their node.
    for (let i = 1; i < g.chain.length; i++) {
      const h = humanById(g, g.chain[i].hid);
      if (h) (h.x = g.chain[i].x), (h.y = g.chain[i].y);
    }
  }

  function settleChainToLander(g) {
    const a = landerAnchor(g);
    let y = a.y;
    for (let i = 0; i < g.chain.length; i++) {
      y += i === 0 ? CFG.hookLen : linkLen(g.chain[i]);
      const n = g.chain[i];
      n.x = n.px = a.x;
      n.y = n.py = y;
    }
  }

  function updateHumans(g, dt) {
    for (const h of g.humans) {
      if (h.loose > 0) h.loose -= dt;
      if (h.state === "carried") continue; // the Rescuer positions it
      if (h.state === "walk" && slopeAt(g, h.x).steep > 2) {
        // Landed on a cliff face: slide down to the foot.
        h.x += slopeAt(g, h.x).down * 30 * dt;
        h.y = groundAt(g, h.x) - 3;
      } else if (h.state === "walk") {
        h.walkT -= dt;
        if (h.walkT <= 0) {
          h.walkT = 1.5 + g.rand() * 3;
          h.dir = g.rand() < 0.5 ? -1 : 1;
        }
        const nx = h.x + h.dir * CFG.walkSpeed * (h.w > 1 ? 0.6 : 1) * dt;
        // Walls steeper than 2 px per px turn walkers around.
        if (Math.abs(groundAt(g, nx) - groundAt(g, h.x)) > 2 * Math.abs(nx - h.x) + 0.6) h.dir = -h.dir;
        else h.x = nx;
        if (h.x < 8) (h.x = 8), (h.dir = 1);
        if (h.x > CFG.W - 8) (h.x = CFG.W - 8), (h.dir = -1);
        h.y = groundAt(g, h.x) - 3;
      } else if (h.state === "fall") {
        h.y += (h.w > 1 ? CFG.heavyFall : CFG.fallSpeed) * dt;
        h.x += Math.sin(g.t * 3 + h.id) * 6 * dt;
        h.x = clamp(h.x, 6, CFG.W - 6);
        const floor = groundAt(g, h.x) - 3;
        if (h.y >= floor) {
          h.y = floor;
          h.state = "walk";
          h.walkT = 0.8;
          g.events.push({ t: "land", x: h.x });
        }
      }
    }
  }

  function tip(g) {
    return g.chain[g.chain.length - 1];
  }

  function checkAttach(g) {
    if (!g.lander.alive || g.lander.docked) return;
    // Attach can cascade within one frame during a ground sweep, but each new body
    // must be touched by the *new* tip, so at most a couple per frame in practice.
    for (let guard = 0; guard < 4; guard++) {
      const t = tip(g);
      let best = null;
      let bd = CFG.grabR;
      for (const h of g.humans) {
        if (h.state !== "walk" && h.state !== "fall" && h.state !== "carried") continue;
        if (h.loose > 0) continue;
        const d = Math.hypot(h.x - t.x, h.y - t.y);
        if (d < bd) (bd = d), (best = h);
      }
      if (!best) return;
      const wasFalling = best.state === "fall" || best.state === "carried";
      if (best.state === "carried") stealBack(g);
      best.state = "held";
      g.chain.push({ x: best.x, y: best.y, px: best.x - (t.x - t.px) * 0.5, py: best.y - (t.y - t.py) * 0.5, hid: best.id, w: best.w });
      const n = bodyCount(g);
      g.stats.maxChain = Math.max(g.stats.maxChain, n);
      if (wasFalling) g.stats.recatches++;
      g.events.push({ t: "attach", n, w: chainWeight(g), heavy: best.w > 1, x: best.x, y: best.y, air: wasFalling, hid: best.id });
    }
  }

  function updateReel(g, dt) {
    const r = g.reel;
    if (!r) return;
    r.t += dt;
    while (r.t >= CFG.reelStep && g.chain.length > 1) {
      r.t -= CFG.reelStep;
      // Reel from the top: the body nearest the hatch goes in first.
      const node = g.chain.splice(1, 1)[0];
      const h = humanById(g, node.hid);
      if (h) {
        g.humans.splice(g.humans.indexOf(h), 1);
      }
      // Each weight unit pays the next odd step: 100, 300, 500 … so a haul of weight W sums to 100·W².
      const w = node.w || 1;
      let pts = 0;
      for (let u = 0; u < w; u++) {
        r.w++;
        pts += CFG.scoreUnit * (2 * r.w - 1);
      }
      r.n++;
      if (g.bonus) g.bonus.delivered++;
      r.gained += pts;
      addScore(g, pts);
      g.stats.delivered++;
      g.events.push({ t: "reel", k: r.n, w: r.w, heavy: w > 1, pts, x: g.ship.x });
    }
    if (g.chain.length <= 1 && r.t >= CFG.reelStep) {
      g.stats.deliveries.push(r.w);
      g.events.push({ t: "delivered", n: r.w, bodies: r.n, pts: r.gained, x: g.ship.x });
      g.reel = null;
      const L = g.lander;
      L.docked = false;
      L.y = CFG.topY + 6;
      L.vy = 30;
      L.invuln = Math.max(L.invuln, 0.5);
      settleChainToLander(g);
    }
  }

  function addScore(g, pts) {
    g.score += pts;
    while (g.score >= g.nextExtend) {
      g.lives++;
      g.nextExtend += CFG.extendEvery;
      g.events.push({ t: "extend" });
    }
  }

  // Row test used by lasers and the Defender's hull: returns the first chain index the band crosses.
  // The tractor link above each body is part of the chain, so the vulnerable surface is the whole
  // vertical span of the chain, not just the bodies.
  function chainCutIndex(g, y0, y1, x0, x1) {
    const a = landerAnchor(g);
    for (let i = 1; i < g.chain.length; i++) {
      const p = i === 1 ? g.chain[0] : g.chain[i - 1];
      const n = g.chain[i];
      const top = Math.min(p.y, n.y) - 1;
      const bot = Math.max(p.y, n.y) + 3;
      if (bot < y0 || top > y1) continue;
      // x of the link at the band centre
      const yc = clamp((y0 + y1) / 2, Math.min(p.y, n.y), Math.max(p.y, n.y));
      const f = Math.abs(n.y - p.y) < 1e-3 ? 0.5 : (yc - p.y) / (n.y - p.y);
      const x = p.x + (n.x - p.x) * clamp(f, 0, 1);
      if (x >= x0 - 2 && x <= x1 + 2) return i;
    }
    // The hook link (anchor → hook) — cutting it drops everything.
    if (g.chain.length > 1) {
      const h = g.chain[0];
      const top = Math.min(a.y, h.y);
      const bot = Math.max(a.y, h.y);
      if (!(bot < y0 || top > y1) && h.x >= x0 - 2 && h.x <= x1 + 2) return 1;
    }
    return -1;
  }

  function cutChain(g, idx, cause) {
    if (idx < 1 || idx >= g.chain.length) return;
    const dropped = g.chain.splice(idx);
    // Recoil: the part left hanging springs up, hardest at the cut end.
    if (cause !== "death") {
      for (let i = 0; i < g.chain.length; i++) {
        const n = g.chain[i];
        n.py = n.y + (CFG.cutRecoil * (i + 1)) / g.chain.length;
      }
    }
    for (const n of dropped) {
      const h = humanById(g, n.hid);
      if (h) {
        h.state = "fall";
        h.x = n.x;
        h.y = n.y;
        h.loose = CFG.regrabDelay; // a body just cut loose cannot be re-grabbed instantly
      }
    }
    g.stats.cuts++;
    g.events.push({ t: "cut", n: dropped.length, x: dropped[0].x, y: dropped[0].y, cause, hid: dropped[0].hid });
  }

  function updateDefender(g, dt, passive) {
    const d = g.def;
    const L = g.lander;
    const s = roundScale(g.round);
    const hs = g.alert ? CFG.hotSpeed : 1;
    const hc = g.alert ? CFG.hotClimb : 1;
    const hf = g.alert ? CFG.hotFire : 1;
    const dm = g.rules.def || { speed: 1, climb: 1, fire: 1 };
    const speed = CFG.defSpeed * s.speed * dm.speed * hs;
    const climb = CFG.defClimb * s.climb * dm.climb * hc;

    // Choose goal: rescue a falling human if one is reachable, else hunt the lander.
    let target = null;
    d.mode = "hunt";
    let bestD = CFG.defRescueRange;
    for (const h of g.humans) {
      if (h.state !== "fall") continue;
      const dd = Math.abs(wrapDelta(h.x - d.x)) + Math.abs(h.y - d.y) * 0.5;
      if (dd < bestD) (bestD = dd), (target = h);
    }
    let tx, ty;
    if (target) {
      d.mode = "rescue";
      d.lock = null;
      d.targetId = target.id;
      tx = target.x;
      ty = target.y;
      // A rescuing pilot does not fly through the lander to reach a captive: while the lander
      // is in the way it holds its altitude.
      if (L.alive && Math.abs(wrapDelta(L.x - d.x)) < 30 && Math.abs(L.y - d.y) < 22) ty = d.y;
    } else if (!passive && L.alive) {
      tx = L.x;
      // On approach the pilot lines up on the lander, or — with captives aboard — on the middle of
      // the tractor chain, to cut them free.
      // (A chain dragging on the ground frees no one: then it lines up on the lander itself.)
      const tp = tip(g);
      const hanging = g.chain.length > 1 && tp.y < groundAt(g, tp.x) - 6;
      ty = hanging ? (L.y + tp.y) / 2 + 3 : L.y;
      // A pass is a commitment: once the lander is inside commit range ahead, the pilot locks the
      // row it is flying and holds it dead straight until the lander is behind it.
      const ahead = wrapDelta(L.x - d.x) * d.dir;
      const rel = Math.abs(wrapDelta(L.x - d.x));
      // Only a ship at full speed can commit; while swinging round it lines up again.
      const atSpeed = d.vx * d.dir > speed * 0.8;
      if (d.calm > 0 || (d.lock === null && rel < CFG.defPointBlank)) {
        // Just rescued someone, or already on top of the lander without a pass: fly flat.
        ty = d.y;
      } else if (d.lock === null && atSpeed && ahead > 0 && ahead < CFG.defCommitRange && Math.abs(d.y - ty) < 8 && d.y <= floorAhead(g, d, ahead + 20)) {
        // (It commits only once lined up; until then it keeps visibly diving or climbing.)
        d.lock = d.y;
        g.events.push({ t: "lock", y: d.lock });
      } else if (d.lock !== null && ahead < -CFG.defHalfW - 6) {
        d.lock = null;
      }
      // Terrain rising into a committed row aborts the pass: it pulls up rather than being
      // shoved off the line.

          burst(e.x, e.y - 5, P.warn, 8, 40, 0.25);
          if (e.shielded) {
            popup(e.x, e.top - 6, "SHIELD", P.beam, 1, 0.5);
            burst(e.x, e.top, "#ffffff", 8, 70, 0.2);
          }
          burst(e.x, e.top, P.warn, 6, 50, 0.25);
          break;
        case "graze":
          // a streak of sparks along the passing shot / hull
          for (let k = 0; k < 7; k++)
            app.fx.push({ k: "p", x: e.x + (Math.random() - 0.5) * 6, y: e.y + (Math.random() - 0.5) * 3, vx: e.dir * (60 + Math.random() * 80), vy: (Math.random() - 0.5) * 20, life: 0.25, t: 0, color: k % 2 ? "#ffffff" : P.score });
          break;
        case "boom":
          burst(e.x, e.y, P.mine, 12, 70, 0.4);
          burst(e.x, e.y, P.mineCore, 6, 40, 0.3);
          break;
        case "alert":
          app.hotPulse = 1.4;
          break;
        case "death":
          burst(e.x, e.y, P.lander, 26, 110, 0.9);
          burst(e.x, e.y, P.landerEye, 14, 60, 0.7);
          app.shake = 0.4;
          break;
        case "fire":
          burst(e.x, e.y, P.def, 3, 30, 0.12);
          break;
        case "extend":
          popup(W / 2, 110, "EXTRA LANDER", P.lander, 1, 1.6);
          break;
      }
    }
    g.events.length = 0;
  }

  function updateFx(dt) {
    for (let i = app.fx.length - 1; i >= 0; i--) {
      const f = app.fx[i];
      f.t += dt;
      if (f.k === "p") {
        f.x += f.vx * dt;
        f.y += f.vy * dt;
        f.vx *= 0.96;
        f.vy *= 0.96;
      } else if (f.k === "t") f.y -= 14 * dt;
      if (f.t >= f.life) app.fx.splice(i, 1);
    }
    for (const [k, v] of app.bodyFlash) v - dt <= 0 ? app.bodyFlash.delete(k) : app.bodyFlash.set(k, v - dt);
    for (const [k, v] of app.yank) v - dt <= 0 ? app.yank.delete(k) : app.yank.set(k, v - dt);
    app.shipFlash = Math.max(0, app.shipFlash - dt);
    app.shipGlow = Math.max(0, app.shipGlow - dt);
    app.hotPulse = Math.max(0, app.hotPulse - dt);
    app.shake = Math.max(0, app.shake - dt);
    app.flash = Math.max(0, app.flash - dt);
    app.landerFlash = Math.max(0, (app.landerFlash || 0) - dt);
  }

  // Per-planet ground colours: [surface line, fill, far ridge]. Only the ground changes colour;
  // every actor keeps its colour on every planet.
  const PLANET_COLORS = [
    ["#2fbf8f", "#06261c", "#1c4a5a"], // VERDA
    ["#d8841c", "#2a1604", "#5a2a6a"], // OCHRE
    ["#e04a2a", "#2a0804", "#5a1a1a"], // CINDER
    ["#9a6aff", "#120a2a", "#2a2a5a"], // VOID
  ];

  // ------------------------------------------------------------------ render
  function drawWorld(g) {
    const t = g.t;
    const pc = DEGRADE ? ["#909090", "#202020", "#303030"] : PLANET_COLORS[(g.rules && g.rules.planet) || 0];
    // backdrop
    cx.fillStyle = P.star;
    for (const [x, y] of stars) cx.fillRect(x, y, 1, 1);
    cx.fillStyle = pc[2];
    for (let x = 0; x < W; x++) cx.fillRect(x, ridge[x] - 16, 1, 1);
    // terrain: filled below the surface, bright surface line (the surface is what matters)
    if (g.ground) {
      cx.fillStyle = pc[1];
      for (let x = 0; x < W; x++) cx.fillRect(x, g.ground[x] + 1, 1, H - g.ground[x] - 1);
      cx.fillStyle = pc[0];
      for (let x = 0; x < W; x++) {
        const y0 = g.ground[x] + 1;
        const y1 = x + 1 <= W ? g.ground[x + 1] + 1 : y0;
        cx.fillRect(x, Math.min(y0, y1), 1, Math.abs(y1 - y0) + 1);
      }
    }

    // mothership + hatch
    const s = g.ship;
    const n = SKY.bodyCount(g);
    // Each body reeled in lights the windows; a big haul lights the whole hull.
    const glow = app.shipGlow > 0 && g === app.game && (t * 12) % 1 < 0.6;
    const winLit = app.shipFlash > 0 && g === app.game;
    spr(SHIP, s.x, CFG.shipY, { s: glow ? "#ffffff" : P.ship, d: glow ? P.hatch : winLit ? "#ffffff" : P.shipDark }, false);
    const hatchOn = !DEGRADE && (n > 0 || (g.lander && g.lander.docked));
    const hx = Math.round(s.x - CFG.hatchHalfW);
    const hw = CFG.hatchHalfW * 2;
    if (!DEGRADE) {
      // The hatch is a doorway cut into the hull (not a bar): dark opening, lit frame.
      cx.fillStyle = "#000";
      cx.fillRect(hx, CFG.shipY + 1, hw, 4);
      if (!s.open) {
        // Shut: red doors across the opening.
        cx.fillStyle = P.warn;
        cx.fillRect(hx, CFG.shipY + 3, hw, 2);
        cx.fillStyle = "#000";
        cx.fillRect(Math.round(s.x), CFG.shipY + 3, 1, 2);
      } else {
        const warn = s.warn && (t * 10) % 1 < 0.5;
        if (warn) {
          cx.fillStyle = P.warn;
          cx.fillRect(hx, CFG.shipY + 4, hw, 1);
        }
        if (hatchOn && !warn) {
          // Carrying: the opening glows (the home arrow beside the lander points here).
          cx.fillStyle = (t * 4) % 1 < 0.6 ? P.hatch : "#1a7a2a";
          cx.fillRect(hx + 1, CFG.shipY + 2, hw - 2, 2);
        }
      }
    } else {
      cx.fillStyle = P.shipDark;
      cx.fillRect(hx, CFG.shipY + 3, hw, 2);
    }

    // humans on the ground / falling
    for (const h of g.humans) if (h.state !== "held") drawHuman(h.x, h.y, h.state, t, h.id, h.w > 1);

    // mines: hollow and dim while arming; blink faster as they expire
    for (const m of g.mines) {
      const armed = m.t >= CFG.mineArm;
      const left = CFG.mineLife - m.t;
      if (left < 2 && (t * (left < 0.8 ? 16 : 8)) % 1 < 0.4) continue;
      if (armed) spr(MINE, m.x, m.y, { m: P.mine, M: P.mineCore }, false);
      else {
        cx.fillStyle = "#6a2020";
        cx.fillRect(Math.round(m.x) - 1, Math.round(m.y) - 1, 3, 3);
      }
    }

    // chain
    const L = g.lander;
    if (L && L.alive && g.chain.length) {
      let px = L.x;
      let py = L.y + CFG.landerHalfH;
      for (let i = 0; i < g.chain.length; i++) {
        const nd = g.chain[i];
        const ex = nd.x;
        const hv = i > 0 && nd.w > 1;
        const ey = i === 0 ? nd.y : nd.y - (hv ? 5 : 4);
        const steps = Math.max(1, Math.round(Math.hypot(ex - px, ey - py)));
        // Tension: a link stretched to its full length glows bright; a slack one dims.
        const prevN = i === 0 ? { x: L.x, y: L.y + CFG.landerHalfH } : g.chain[i - 1];
        const rest = i === 0 ? CFG.hookLen : SKY.linkLen(nd);
        const taut = Math.hypot(nd.x - prevN.x, nd.y - prevN.y) > rest * 0.96;
        for (let k = 0; k < steps; k++) {
          const f = k / steps;
          // beam energy flows downward
          const on = ((k - Math.floor(t * 24)) % 3 + 3) % 3 !== 0;
          cx.fillStyle = DEGRADE ? P.beam : taut ? (on ? "#c8fbff" : P.beam) : on ? P.beamDim : "#0a3440";
          cx.fillRect(Math.round(px + (ex - px) * f), Math.round(py + (ey - py) * f), 1, 1);
        }
        px = nd.x;
        py = nd.y + (hv ? 4 : 4);
        if (i === 0) {
          cx.fillStyle = P.beam;
          cx.fillRect(Math.round(nd.x) - 1, Math.round(nd.y), 3, 1);
          cx.fillRect(Math.round(nd.x), Math.round(nd.y) - 1, 1, 3);
          px = nd.x;
          py = nd.y;
        }
      }
      for (let i = 1; i < g.chain.length; i++) {
        const nd = g.chain[i];
        // (a just-grabbed body is drawn yanked up toward the lander for a moment)
        const yk = app.yank.get(nd.hid) || 0;
        drawHuman(nd.x, nd.y - Math.round((yk / 0.14) * 4), "held", t, nd.hid, nd.w > 1);
      }
      // the hook end glows: whatever it touches comes aboard
      const tp = g.chain[g.chain.length - 1];
      if ((t * 8) % 1 < 0.5) {
        cx.fillStyle = P.beam;
        const ty = Math.round(tp.y) + (g.chain.length > 1 ? 5 : 2);
        cx.fillRect(Math.round(tp.x) - 2, ty, 1, 1);
        cx.fillRect(Math.round(tp.x) + 2, ty, 1, 1);
      }
    }

    // lander
    if (L && L.alive) {
      const vis = L.invuln <= 0 || (t * 12) % 1 < 0.6;
      const lc = app.landerFlash > 0 ? "#ffffff" : P.lander;
      if (vis) sprLean((t * 6) % 1 < 0.5 ? LANDER : LANDER2, L.x, L.y, { g: lc, y: P.landerEye }, g === app.game ? app.lean * 2 : 0);
      // Carrying: a small arrow beside the lander points home to the hatch.
      if (!DEGRADE && n > 0 && !L.docked && g.ship.open && (t * 3) % 1 < 0.7) {
        const vx = s.x - L.x;
        const vy = CFG.shipY + 6 - L.y;
        const m = Math.hypot(vx, vy) || 1;
        if (m > 24) {
          const ux = vx / m;
          const uy = vy / m;
          const ax = L.x + ux * 17;
          const ay = L.y + uy * 17;
          cx.fillStyle = P.hatch;
          for (let k = 0; k < 8; k++) cx.fillRect(Math.round(ax - ux * k), Math.round(ay - uy * k), 2, 2);
          // arrowhead: two barbs sweeping back from the tip
          for (let k = 1; k <= 3; k++) {
            cx.fillRect(Math.round(ax - ux * k - uy * k), Math.round(ay - uy * k + ux * k), 2, 2);
            cx.fillRect(Math.round(ax - ux * k + uy * k), Math.round(ay - uy * k - ux * k), 2, 2);
          }
        }
      }
      // "YOU" over the lander at the start of each life.
      // (Beside it, pointing in: the lander spawns right under the mothership.)
      if (!DEGRADE && (g.phase === "ready" || L.invuln > 0.6) && (t * 4) % 1 < 0.75) {
        const side = L.x < W - 40 ? 1 : -1;
        const ax = Math.round(L.x + side * 9);
        const ay = Math.round(L.y) - 1;
        cx.fillStyle = P.lander;
        cx.fillRect(ax, ay, 1, 1);
        cx.fillRect(ax + side, ay - 1, 1, 3);
        text("YOU", ax + side * 4, ay - 2, P.lander, 1, side > 0 ? "left" : "right");
      }
    }

    // defender
    const d = g.bonus || g.phase === "complete" || g.cleared ? null : g.def; // grounded during a bonus stage and the ending
    if (d) {
      const hot = g.alert;
      // ACE rounds fly a deeper red with a gold stripe: the same pilot, better.
      const ace = g.rules && g.rules.def && g.rules.def.speed >= 1.3; // ACE pilot (rounds 6 and 8)
      // Every Defender is red now (it is the enemy), so HOT needs its own signal: the hull strobes
      // red/yellow and drags two dark afterimages.
      const body = hot ? ((t * 8) % 1 < 0.5 ? P.defHot : P.score) : ace ? P.defAce : P.def;
      const nose = d.tele > 0 && (t * 20) % 1 < 0.5;
      const flame = (t * 15) % 1 < 0.5 ? P.flame : P.landerEye;
      const dx = Math.round(d.x);
      const dy = Math.round(d.y);
      if (dx > -12 && dx < W + 12) {
        // A committed pass burns harder: longer exhaust, the ship will not change rows.
        const locked = d.lock !== null && d.mode === "hunt";
        if (hot)
          for (const k of [2, 1]) {
            const c = k === 2 ? "#3a0808" : "#701010";
            spr(DEF, dx - d.dir * k * 7, dy, { w: c, f: c, r: c }, d.dir < 0);
          }
        const rolling = g.phase === "dying" && (t * 10) % 1 < 0.5;
        spr(rolling ? DEF.slice().reverse() : locked ? DEF_BURN : DEF, dx - (locked ? d.dir : 0), dy, { w: body, f: flame, r: hot || ace ? P.score : P.defStripe }, d.dir < 0);
        if (nose) {
          cx.fillStyle = "#ffffff";
          cx.fillRect(dx + d.dir * 10 - 1, dy - 1, 3, 3);
        }
      } else {
        // off-screen: edge marker at its altitude
        cx.fillStyle = body;
        const ex = dx <= -12 ? 0 : W - 2;
        cx.fillRect(ex, dy - 2, 2, 5);
      }
      // A locked pass: row ticks at both screen edges, so the committed row reads at a glance.
      if (d.lock !== null && d.mode === "hunt") {
        cx.fillStyle = hot ? P.defHot : "#8a8aa8";
        const ly = Math.round(d.lock);
        cx.fillRect(0, ly, 5, 1);
        cx.fillRect(W - 5, ly, 5, 1);
      }
      if (d.tele > 0) {
        // Telegraph: a sparse sight line ahead along the committed row.
        cx.fillStyle = hot ? P.defHot : "#5a5a7a";
        const y = Math.round(d.y);
        for (let x = dx + d.dir * 12; x >= 0 && x < W; x += d.dir * 6) cx.fillRect(x, y, 2, 1);
      }
    }

    // turrets: the barrel blinks and a dotted column shows the line it will fire along; the
    // beam itself stops where it hit
    for (const tu of g.turrets || []) {
      const tx = Math.round(tu.x);
      const ty = Math.round(tu.y);
      const charging = tu.charge > 0;
      spr(TURRET, tx, ty - 2, { s: P.turret, b: charging && (t * 16) % 1 < 0.5 ? P.warn : P.turret }, false);
      if (charging) {
        cx.fillStyle = "#5a2a2a";
        for (let y = ty - 8; y > CFG.topY - 8; y -= 6) cx.fillRect(tx, y, 1, 2);
      }
      if (tu.beam > 0) {
        const top = Math.round(tu.top || 0);
        const a = tu.beam / CFG.turretBeam;
        cx.fillStyle = a > 0.5 ? P.warn : "#801818";
        cx.fillRect(tx - 1, top, 3, ty - 5 - top);
        cx.fillStyle = "#ffffff";
        if (a > 0.4) cx.fillRect(tx, top, 1, ty - 5 - top);
      }
    }

    // rescuer: claw opens while it hunts a chain end; a lamp blinks
    const rs = g.rescuer;
    if (rs) {
      const rx = Math.round(rs.x);
      const ry = Math.round(rs.y);
      if (rx > -8 && rx < W + 8) {
        spr(RESCUER, rx, ry, { y: P.rescuer, w: "#ffffff", k: P.rescuerDark }, rs.dir < 0);
        const hunting = rs.mode === "chase";
        spr(hunting ? CLAW_OPEN : CLAW_SHUT, rx, ry + 4, { k: hunting ? P.rescuer : P.rescuerDark }, false);
        if (hunting && (t * 6) % 1 < 0.5) {
          cx.fillStyle = P.warn;
          cx.fillRect(rx, ry - 3, 1, 1);
        }
      }
    }

    // bomber
    const b = g.bomber;
    if (b) {
      const bx = Math.round(b.x);
      if (bx > -10 && bx < W + 10) spr(BOMBER, bx, Math.round(b.y), { b: P.bomber, k: P.bomberDark, o: (t * 6) % 1 < 0.5 ? P.mine : P.bomberDark }, b.dir < 0);
      else {
        cx.fillStyle = P.bomber;
        cx.fillRect(bx <= -10 ? 0 : W - 2, Math.round(b.y) - 2, 2, 5);
      }
    }

    // lasers
    for (const l of g.lasers) {
      const [x0, x1] = SKY.laserSpan(l);
      const y = Math.round(l.y);
      const cols = ["#ffffff", "#ffe23c", "#ff3ccf", "#2fe0ff", "#3cff5a"];
      for (let x = Math.max(0, Math.floor(x0)); x <= Math.min(W, x1); x += 3) {
        const dist = l.dir > 0 ? x1 - x : x - x0;
        cx.fillStyle = DEGRADE ? "#909090" : dist < 12 ? "#ffffff" : cols[(Math.floor(x / 3) + Math.floor(l.t * 30)) % cols.length];
        cx.fillRect(x, y, dist < 12 ? 3 : 2, 1);
      }
    }
  }

  function drawFx() {
    for (const f of app.fx) {
      const a = 1 - f.t / f.life;
      if (f.k === "p") {
        if (a > 0.15 || (f.t * 30) % 2 < 1) {
          cx.fillStyle = f.color;
          cx.fillRect(Math.round(f.x), Math.round(f.y), 1, 1);
        }
      } else if (f.k === "t") {
        if (a > 0.3 || (f.t * 20) % 2 < 1) text(f.s, f.x, Math.round(f.y), f.color, f.scale, "center");
      } else if (f.k === "cut") {
        cx.fillStyle = "#ffffff";
        const r = Math.round(2 + f.t * 30);
        cx.fillRect(Math.round(f.x) - r, Math.round(f.y), r * 2 + 1, 1);
      }
    }
  }

  // Clear-screen time bonus count-up: 0 → 1 over one second, starting after the clear jingle
  // (its tick sound in audio.js starts at 0.95 s and spans 1 s).
  function timeCountK(g) {
    if (g.phase !== "clear" || !g.clearInfo || !(g.clearInfo.secsLeft > 0)) return -1;
    const shown = CFG.clearTime + 0.8 - g.phaseT;
    return Math.max(0, Math.min(1, (shown - 0.95) / 1.0));
  }

  function drawHud(g, demo) {
    // Arcade layout: 1UP, your score, your reserve landers and what your chain would add, all on
    // the left in your colour — so the green craft reads as "you" without a word of explanation.
    text("1UP", 4, 3, P.lander, 1);
    const shown = g === app.game ? app.shownScore : g.score;
    text(String(shown).padStart(6, "0"), 20, 3, P.text, 1);
    for (let i = 0; i < Math.min(5, g.lives - (g.phase === "dying" ? 0 : 1)); i++) {
      const lx = 4 + i * 7;
      cx.fillStyle = P.lander;
      cx.fillRect(lx + 1, 10, 3, 1);
      cx.fillRect(lx, 11, 5, 1);
      cx.fillRect(lx, 12, 1, 2);
      cx.fillRect(lx + 2, 12, 1, 2);
      cx.fillRect(lx + 4, 12, 1, 2);
    }
    if (!DEGRADE && g.lander && g.lander.alive && !g.lander.docked && SKY.bodyCount(g) > 0) {
      const w = SKY.chainWeight(g);
      text("+" + w * w * CFG.scoreUnit, 46, 3, w >= 5 ? P.score : P.lander, 1);
    }
    text("HI " + String(Math.max(app.hi, g.score)).padStart(6, "0"), W / 2, 3, P.dim, 1, "center");
    text(g.bonus ? "BONUS" : "R" + g.round, W - 4, 3, P.dim, 1, "right");
    // Time until the Defender goes HOT: a shrinking bar under HI (green, yellow for the last 10 s,
    // blinking red for the last 5 s); once HOT it becomes the word itself.
    if (!g.bonus && g.rules && !DEGRADE && !g.cleared) {
      const total = SKY.hotTime(g);
      const kT = timeCountK(g);
      // On the clear screen the fuse drains into the time bonus as it is counted.
      const draining = kT >= 0 && kT < 1;
      const left = kT >= 0 ? g.clearInfo.secsLeft * (1 - kT) : Math.max(0, total - g.roundT);
      if (g.alert) {
        if (g.phase !== "play" || (g.t * 3) % 1 < 0.6) text("HOT", W / 2, 10, P.warn, 1, "center");
      } else {
        const bw = 64;
        const x0 = Math.round(W / 2 - bw / 2);
        const fill = Math.round((bw * left) / total);
        const warn = kT < 0 && left <= 5; // (no warning while it drains into the bonus)
        // Amber, never the player's green: it is the Defender's fuse, and a tiny Defender sits at its
        // end to say so.
        const col = draining ? ((g.t * 16) % 1 < 0.5 ? "#ffffff" : P.score) : kT >= 0 ? P.fuse : warn ? P.warn : left <= 10 ? P.score : P.fuse;
        cx.fillStyle = "#1a1a2a";
        cx.fillRect(x0, 11, bw, 2);
        if (!warn || (g.t * 4) % 1 < 0.6) {
          cx.fillStyle = col;
          cx.fillRect(x0, 11, fill, 2);
        }
        cx.fillStyle = warn ? P.warn : P.def;
        cx.fillRect(x0 + bw + 3, 11, 6, 1);
        cx.fillRect(x0 + bw + 4, 10, 2, 1);
        cx.fillRect(x0 + bw + 5, 12, 3, 1);
        cx.fillStyle = P.flame;
        cx.fillRect(x0 + bw + 2, 11, 1, 1);
      }
    }
    // Captives still to haul: a small figure and a count, under the score.
    const left = g.bonus ? g.bonus.total - g.bonus.spawned + g.humans.length : g.humans.length;
    {
      const tx = W - 4 - String(left).length * 4 + 1;
      cx.fillStyle = P.human;
      cx.fillRect(tx - 4, 11, 1, 4);
      cx.fillStyle = P.humanHead;
      cx.fillRect(tx - 4, 10, 1, 1);
      text(String(left), W - 4, 10, P.human, 1, "right");
    }
    if (g.bonus && g.phase === "play") text(String(Math.ceil(g.bonus.t)), W / 2, 12, g.bonus.t < 5 ? P.warn : P.score, 2, "center");
    if (demo) return;
    if (g.bonus && g.phase === "ready") {
      text("BONUS STAGE", W / 2, 90, P.score, 2, "center");
      text("CATCH " + g.bonus.total, W / 2, 110, P.beam, 1, "center");
    } else if (g.bonus && g.phase === "clear") {
      const b = g.bonus;
      text(b.delivered + " / " + b.total, W / 2, 90, P.human, 2, "center");
      if (b.delivered >= b.total && (g.t * 4) % 1 < 0.7) text("PERFECT " + CFG.bonusPerfect * (g.rules.tour + 1), W / 2, 110, P.score, 2, "center");
    } else if (g.phase === "ready" && g.roundT === 0) {
      if (g.rules.firstOfPlanet) text("PLANET " + g.rules.planetName, W / 2, 78, PLANET_COLORS[g.rules.planet][0], 2, "center");
      text("ROUND " + g.round, W / 2, 96, P.text, 2, "center");
      text("HAUL " + g.humans.length, W / 2, 114, P.human, 1, "center");
      if (g.rules.tag) text(g.rules.tag, W / 2, 126, g.rules.tag === "ACE" ? P.warn : P.score, 1, "center");
    } else if (g.phase === "ready") {
      text("READY", W / 2, 100, P.lander, 2, "center");
    } else if (g.phase === "clear") {
      text("SKY CLEAR", W / 2, 84, P.lander, 2, "center");
      const ci = g.clearInfo || { bonus: CFG.roundBonus * (g.rules.tour + 1), secsLeft: 0, timeBonus: 0 };
      text("BONUS " + ci.bonus, W / 2, 104, P.score, 1, "center");
      if (ci.secsLeft > 0) {
        // Count the fuse's seconds up into points while the fuse itself drains (see the HUD).
        const k = timeCountK(g);
        const secs = Math.round(ci.secsLeft * k);
        const per = ci.timeBonus / ci.secsLeft;
        text("TIME " + secs + " x " + per + " = " + secs * per, W / 2, 116, P.fuse, 1, "center");
      }
    } else if (g.phase === "complete") {
      const c = g.complete;
      const shown = CFG.completeTime - g.phaseT;
      text("MISSION", W / 2, 70, P.lander, 3, "center");
      text("COMPLETE", W / 2, 92, P.lander, 3, "center");
      if (shown > 1.2) {
        const k = Math.min(1, (shown - 1.2) / 1.2);
        const ships = Math.round(c.lives * k);
        text("SHIPS " + ships + " x " + CFG.livesBonus + " = " + ships * CFG.livesBonus, W / 2, 126, P.score, 1, "center");
        // reserve landers march across as they are counted
        for (let i = 0; i < ships; i++) spr(LANDER, W / 2 - (c.lives - 1) * 8 + i * 16, 146, { g: P.lander, y: P.landerEye }, false);
      }
      if (shown > 3) text("SCORE " + String(g.score).padStart(6, "0"), W / 2, 164, P.text, 1, "center");
    } else if (g.phase === "over") {
      if (g.cleared) {
        text("MISSION COMPLETE", W / 2, 96, P.lander, 2, "center");
        text("SCORE " + String(g.score).padStart(6, "0"), W / 2, 116, P.text, 1, "center");
      } else text("GAME OVER", W / 2, 100, P.warn, 2, "center");
    }
  }

  function drawTitle() {
    text("SKYHAUL", W / 2, 62, P.lander, 4, "center");
    // The whole game inverts a genre everyone knows: say who you are, once.
    spr(LANDER, W / 2 - 50, 100, { g: P.lander, y: P.landerEye }, false);
    text("YOU ARE THE LANDER", W / 2 + 6, 98, P.lander, 1, "center");
    if ((app.frame / 30) % 2 < 1.4) text("PRESS SPACE", W / 2, 124, P.text, 1, "center");
    text("HI " + String(app.hi).padStart(6, "0"), W / 2, 140, P.dim, 1, "center");
  }

  // Ranking rows; `preview` shows the current run at its rank without writing storage.
  function drawTable(y0, preview) {
    let rows = readTable();
    let hi = app.newRank;
    if (preview) {
      rows = rows.slice();
      rows.splice(preview.rank, 0, { score: preview.score, name: (preview.name + "___").slice(0, 3) });
      rows = rows.slice(0, 5);
      hi = preview.rank;
    }
    text("BEST HAULERS", W / 2, y0, P.score, 1, "center");
    rows.forEach((r, i) => {
      const on = i === hi && (preview || (app.frame / 8) % 2 < 1.5);
      const col = i === hi ? P.lander : P.text;
      if (i === hi && !on) return;
      const y = y0 + 14 + i * 11;
      text(i + 1 + ".", 100, y, col, 1);
      text(r.name, 118, y, col, 1);
      text(String(r.score).padStart(6, "0"), 220, y, col, 1, "right");
    });
  }

  function drawEntry() {
    const e = app.entry;
    text("GREAT HAUL", W / 2, 28, P.score, 2, "center");
    drawTable(52, { rank: e.rank, score: e.score, name: e.name });
    BOARD.forEach((c, i) => {
      const x = BX + (i % BCOLS) * BCW;
      const y = BY + Math.floor(i / BCOLS) * BCH;
      const sel = i === e.cursor;
      if (sel) {
        cx.fillStyle = (app.frame / 6) % 2 < 1 ? P.lander : "#1a7a2a";
        cx.fillRect(x + 1, y - 2, BCW - 2, BCH - 3);
      }
      text(c, x + BCW / 2, y + 1, sel ? "#000" : c === "END" ? P.score : c === "DEL" ? P.warn : P.text, 1, "center");
    });
    text(String(Math.ceil(e.t)), W - 8, H - 12, P.dim, 1, "right");
  }

  // ------------------------------------------------------------------ loop
  function resize() {
    const s = Math.max(1, Math.floor(Math.min(innerWidth / W, innerHeight / H)));
    cv.style.width = W * s + "px";
    cv.style.height = H * s + "px";
  }
  addEventListener("resize", resize);
  resize();

  function tick(now) {
    const dt = app.paused ? 0 : Math.min(0.1, (now - (app.last || now)) / 1000);
    app.last = now;
    app.acc += dt;
    app.frame++;
    while (app.acc >= CFG.dt) {
      app.acc -= CFG.dt;
      stepOnce();
    }
    render();
    requestAnimationFrame(tick);
  }

  // Render-only motion feel, updated per tick: the lander banks into its horizontal motion (slower
  // to settle the heavier the haul) and puffs exhaust opposite to the held direction.
  function feelTick(g, inp) {
    const L = g.lander;
    // While the lander goes down, the Defender rolls in triumph and sheds stars.
    if (g.phase === "dying" && g.def && app.modeT % 3 === 0 && g.def.x > 0 && g.def.x < W)
      app.fx.push({ k: "p", x: g.def.x - g.def.dir * 8, y: g.def.y + (Math.random() - 0.5) * 6, vx: -g.def.dir * 20, vy: (Math.random() - 0.5) * 20, life: 0.5, t: 0, color: Math.random() < 0.5 ? "#ffffff" : P.score });
    if (!L || !L.alive || L.docked || g.phase !== "play") {
      app.lean *= 0.8;
      return;
    }
    const w = SKY.chainWeight(g);
    const target = Math.max(-1, Math.min(1, L.vx / CFG.landerSpeed)) * 1.4;
    app.lean += (target - app.lean) * Math.min(1, (10 / (1 + 0.3 * w)) * CFG.dt);
    const m = Math.hypot(inp.dx || 0, inp.dy || 0);
    app.puffT = (app.puffT || 0) - 1;
    if (m > 0.3 && app.puffT <= 0) {
      app.puffT = 3;
      const ux = inp.dx / m;
      const uy = inp.dy / m;
      app.fx.push({ k: "p", x: L.x - ux * 5, y: L.y + 3 - uy * 3, vx: -ux * 40 + (Math.random() - 0.5) * 10, vy: 25 - uy * 30, life: 0.22, t: 0, color: Math.random() < 0.5 ? P.flame : P.landerEye });
    }
  }

  function stepDemo() {
    if (!app.demo || app.demo.phase === "over") startDemo();
    SKY.step(app.demo, app.demoBot(app.demo));
    handleEvents(app.demo, false);
  }

  function stepOnce() {
    app.modeT++;
    const secs = app.modeT * CFG.dt;
    if (app.mode === "play") {
      const g = app.game;
      const inp = readInput();
      SKY.step(g, inp);
      handleEvents(g, true);
      feelTick(g, inp);
      // HUD score rolls up (fast enough that a big haul spins for about a second). On the clear
      // screen the time bonus is held back until the fuse has drained it in.
      const kT = timeCountK(g);
      const pending = kT >= 0 ? Math.round((g.clearInfo.timeBonus * (1 - kT)) / 10) * 10 : 0;
      const target = g.score - pending;
      if (app.shownScore > g.score) app.shownScore = g.score;
      else if (app.shownScore < target) app.shownScore = Math.min(target, app.shownScore + Math.max(10, Math.ceil((target - app.shownScore) * 0.08 / 10) * 10));
      const w = g.phase === "play" && g.lander.alive && !g.lander.docked ? SKY.chainWeight(g) : 0;
      SKYAUDIO.engine(w);
      if (g.phase === "over") {
        SKYAUDIO.engine(0);
        setMode("over");
      }
    } else if (app.mode === "over") {
      handleEvents(app.game, false);
      if (secs > 3) {
        const rank = rankFor(app.game.score);
        if (rank >= 0) startEntry(app.game.score, rank);
        else setMode("table");
      }
    } else if (app.mode === "entry") {
      app.entry.t -= CFG.dt;
      if (app.entry.t <= 0) entryFinish();
    } else {
      // attract cycle
      stepDemo();
      if (app.mode === "title" && secs > 6) {
        startDemo();
        setMode("demo");
      } else if (app.mode === "demo" && (secs > 30 || app.demo.phase === "over")) setMode("table");
      else if (app.mode === "table" && secs > 6) {
        app.newRank = -1;
        setMode("title");
      }
    }
    updateFx(CFG.dt);
  }

  function render() {
    cx.setTransform(1, 0, 0, 1, 0, 0);
    cx.fillStyle = app.flash > 0 && (app.flash * 20) % 2 < 1 ? "#1a2a1a" : P.bg;
    cx.fillRect(0, 0, W, H);
    if (app.shake > 0) cx.translate(Math.round((Math.random() - 0.5) * 4), Math.round((Math.random() - 0.5) * 4));
    if (app.mode === "title" || app.mode === "table") {
      drawWorld(app.demo || SKY.createGame(1));
      drawFx();
      cx.fillStyle = "rgba(0,0,0,0.7)";
      cx.fillRect(0, 40, W, 120);
      if (app.mode === "title") drawTitle();
      else drawTable(58, null);
    } else if (app.mode === "demo") {
      drawWorld(app.demo);
      drawFx();
      drawHud(app.demo, true);
      if ((app.frame / 30) % 2 < 1.4) text("PRESS SPACE", W / 2, 100, P.text, 1, "center");
    } else if (app.mode === "entry") {
      cx.fillStyle = P.bg;
      cx.fillRect(0, 0, W, H);
      drawEntry();
    } else {
      drawWorld(app.game);
      drawFx();
      if (app.hotPulse > 0 && (app.hotPulse * 8) % 1 < 0.55) {
        // HOT: the screen edge throbs red for a moment.
        cx.fillStyle = P.warn;
        cx.fillRect(0, 0, W, 2);
        cx.fillRect(0, H - 2, W, 2);
        cx.fillRect(0, 0, 2, H);
        cx.fillRect(W - 2, 0, 2, H);
      }
      drawHud(app.game, false);
    }
  }

  // Test boundary: pause the real-time loop and advance/draw explicit ticks (frame capture).
  window.__sky = { app, readInput, startGame, keys, readTable, rankFor, setMode, stepOnce, render };
  requestAnimationFrame(tick);
})();

window.__agenticSetup({start(){__sky.startGame(1729)},read(){const s=__sky.app.game; return {score:s?.score??0,ended:!!(s&&(s.phase === "over")),won:!!(s&&(s.cleared)),phase:s?.phase??s?.mode??'playing'};}});</script></body></html>
