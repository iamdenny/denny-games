			this.boostOutFlash = Math.max(0, this.boostOutFlash - dt * 5);
			{
				const b = this.sim.boost;
				this.boostEnv = b.active && b.gain > 0 ? Math.max(0, Math.min(1, (this.sim.boostGain || 0) / b.gain)) : 0;
			}
			{
				const s = this.sim;
				const frozen = !(this.mode === MODE.RACE || this.mode === MODE.ATTRACT);
				const curve = frozen ? 0 : this.course.segmentAt(s.z).curve;
				this.bgOffset = bgScrollStep(this.bgOffset, curve, frozen ? 0 : s.speed, dt);
			}
			{
				const s = this.sim;
				const V = SPIN_VIS;
				if (this.scrub.length) {
					for (const m of this.scrub) m.age += dt;
					this.scrub = this.scrub.filter((m) => m.age < (m.puff ? V.puffLife : V.scrubLife));
				}
				if (s.spin > 0 && (this.mode === MODE.RACE || this.mode === MODE.ATTRACT)) {
					const psi = this.spinYaw();
					const cs = Math.cos(psi), sn = Math.sin(psi);
					const hw = CAR_WIDTH / 2, hl = CAR_LEN / 2, xScale = 2 / 10;
					this._scrubT += dt;
					while (this._scrubT >= V.scrubStep) {
						this._scrubT -= V.scrubStep;
						for (const side of [-1, 1]) for (const end of [-1, 1]) {
							const lx = side * hw * cs + end * hl * sn;
							const lz = -side * hw * sn + end * hl * cs;
							this.scrub.push({
								z: s.z + lz,
								x: s.x + lx * xScale,
								age: 0,
								puff: false
							});
						}
					}
					this._puffT += dt;
					const puffStep = HIT.spinTime / V.puffs;
					while (this._puffT >= puffStep) {
						this._puffT -= puffStep;
						const pside = this._puffN++ % 2 ? -1 : 1;
						this.scrub.push({
							z: s.z + hl * .9,
							x: s.x + pside * hw * .8 * xScale,
							age: 0,
							puff: true
						});
					}
				} else {
					this._scrubT = 0;
					this._puffT = 0;
				}
			}
			if (this.entry.cool > 0) this.entry.cool -= dt;
			if (this.mode === MODE.READY && this.modeT >= 2) this._enterRace();
			if (this.mode === MODE.RACE || this.mode === MODE.ATTRACT) {
				const input = this.mode === MODE.ATTRACT ? this._demoInput() : this._playerInput();
				const ev = this.sim.step(dt, input);
				if (this.mode === MODE.RACE && (ev.gameover || this.sim.gameOver)) {
					this._enterGameOver();
					this._reactTo(ev, { silent: true });
				} else if (this.mode !== MODE.ATTRACT) this._reactTo(ev);
			} else this.boostEdge = false;
			if (this.mode === MODE.RACE) {
				if (this.sim.finished) this._enterFinish();
				else if (this.sim.gameOver) this._enterGameOver();
				if (this.sim.timer < 10) {
					this.timeLowTick -= dt;
					if (this.timeLowTick <= 0) {
						this.sound.sfx("timeLow");
						this.timeLowTick = .5 + this.sim.timer * .05;
					}
				} else this.timeLowTick = 0;
			}
			if (this.mode === MODE.ATTRACT && (this.sim.finished || this.modeT > 60)) this._enterAttract();
			if (this.mode === MODE.FINISH) {
				this.finishBonus = Math.min(this.finishTarget, this.finishBonus + this.finishTarget * dt * .6);
				if (this.modeT > 18) this._enterEntryOrAttract();
			}
			if (this.mode === MODE.GAMEOVER && this.modeT > 6) this._enterEntryOrAttract();
			if (this.mode === MODE.ENTRY) this._updateEntry(dt);
			const s = this.sim;
			const engineOn = this.mode === MODE.RACE || this.mode === MODE.READY;
			this.sound.setEngineRunning(engineOn);
			this.sound.setEngine({
				speed01: Math.min(1, s.speed / 100),
				boosting: s.boost.active
			});
			const depth01 = s.zone === "deep" ? s.zoneDepth || 0 : 0;
			this.sound.setDraft(s.zoneLevel * (.7 + .3 * depth01));
		}
		_updateEntry(dt) {
			if (this.entry.cool > 0) return;
			const k = this.keys;
			const i = LETTERS.indexOf(this.entry.name[this.entry.pos]);
			if (k.has("ArrowUp") || k.has("KeyW")) {
				this.entry.name[this.entry.pos] = LETTERS[(i + 1) % 30];
				this.entry.cool = .14;
			} else if (k.has("ArrowDown") || k.has("KeyS")) {
				this.entry.name[this.entry.pos] = LETTERS[(i - 1 + 30) % 30];
				this.entry.cool = .14;
			}
		}
		_reactTo(ev, { silent = false } = {}) {
			if (ev.bump) {
				if (!silent) this.sound.sfx("bump");
				this.shake = .35;
			}
			if (ev.spin) {
				if (!silent) this.sound.sfx("spin");
				this.shake = 1;
			}
			if (ev.slingReady && !silent) this.sound.sfx("chargeFull");
			if (ev.release) {
				if (!silent) this.sound.sfx("release");
				this.releaseFlash = .4;
				const power = ev.release.sling ? 1 : .55 + .45 * ev.release.charge;
				this.boostKick = power;
				this.shake = Math.max(this.shake, .55 * power);
			}
			if (ev.boostEnd) {
				if (!silent) this.sound.sfx("boostOut");
				this.boostOutFlash = 1;
			}
			if (ev.overtake && !silent) this.sound.sfx("overtake", { pan: ev.overtakePan });
			if (ev.passes && ev.passes.length) {
				this.chainFlash = .8;
				this.passReadouts = ev.passes.map((p) => ({
					text: `${p.kind === "rival" ? "RIVAL" : "TRAFFIC"} +${p.points}`,
					chain: p.chain,
					life: 1
				}));
			}
			if (ev.chainEnd && ev.chainEnd.chain > 0) {
				if (ev.chainEnd.awarded) {
					this.chainEndReadout = {
						text: `CHAIN X${ev.chainEnd.chain} BONUS +${ev.chainEnd.bonus}`,
						life: 1.25
					};
					if (ev.chainEnd.bonus > 0 && !silent) this.sound.sfx("chainBonus");
				} else if (ev.chainEnd.reason === "spin") this.chainEndReadout = {
					text: "CHAIN LOST",
					life: .75
				};
			}
			if (ev.checkpoint) {
				if (!silent) this.sound.jingle("checkpoint");
				this.cpFlash = 1.2;
				this.checkpointAward = this.sim.lastCheckpoint;
			}
			if (ev.timeout && !silent) this.sound.sfx("spin");
		}
		attractPanel() {
			const cycleS = ATTRACT_VIEW.titleS + ATTRACT_VIEW.rankingS;
			const t = (this.modeT % cycleS + cycleS) % cycleS;
			const title = t < ATTRACT_VIEW.titleS;
			const localT = title ? t : t - ATTRACT_VIEW.titleS;
			const duration = title ? ATTRACT_VIEW.titleS : ATTRACT_VIEW.rankingS;
			const edgeS = Math.min(localT, duration - localT);
			return {
				phase: title ? "title" : "ranking",
				alpha: Math.max(0, Math.min(1, edgeS / ATTRACT_VIEW.fadeS))
			};
		}
		attractRanking() {
			return this.hi.slice(0, 5).map((entry, index) => ({
				rank: index + 1,
				name: entry.name,
				score: entry.score
			}));
		}
		checkpointReadout() {
			const award = this.checkpointAward || this.sim.lastCheckpoint;
			const timeSet = award ? award.timeSet : legExtension(Math.max(1, this.sim.leg - 1));
			const bonusScore = award ? award.bonusScore : 0;
			return {
				timeText: `${timeSet.toFixed(1)} SEC`,
				bonusText: `TIME LEFT BONUS +${String(Math.floor(bonusScore)).padStart(6, "0")} SCORE`
			};
		}
		render() {
			const ctx = this.ctx;
			ctx.save();
			if (this.shake > 0) {
				const m = this.shake * 3;
				ctx.translate(Math.round((Math.random() - .5) * m), Math.round((Math.random() - .5) * m));
			}
			this._renderWorld();
			ctx.restore();
			this._renderHud();
			this._renderOverlays();
		}
		_renderWorld() {
			const ctx = this.ctx;
			const s = this.sim;
			const r = this.renderer;
			if (this.ceremony) {
				r.beginFrame();
				r.renderCoast(this.ceremonyT);
				r.endFrame();
				return;
			}
			r.beginFrame();
			const punch = Math.min(1, this.boostEnv * .55 + this.boostKick * .85);
			const camDepth = CAMERA_DEPTH * (1 - .2 * punch);
			r.renderRoad(this.course, {
				z: s.z - cameraSetback(camDepth, CAMERA_HEIGHT),
				x: s.x,
				height: CAMERA_HEIGHT,
				depth: camDepth,
				bgOffset: this.bgOffset
			});
			this._boostPunch = punch;
			if (this._boostPunch > .02) this._drawSpeedLines(ctx, this._boostPunch);
			this._drawScrub(ctx);
			const sprites = r.visibleProps(this.course).map((p) => ({
				z: p.z,
				x: p.x,
				category: "prop",
				kind: p.kind,
				o: p
			}));
			for (const c of s.traffic) sprites.push({
				z: c.z,
				x: c.x,
				category: "car",
				kind: "traffic",
				o: c
			});
			for (const c of s.rivals) sprites.push({
				z: c.z,
				x: c.x,
				category: "car",
				kind: "rival",
				o: c
			});
			const cp = this.course.checkpoints[s.leg - 1];
			if (cp) sprites.push({
				z: cp.z,
				x: 0,
				category: "gate",
				kind: "gate",
				isFinish: s.leg >= 8
			});
			for (const p of sortWorldSprites(sprites)) if (p.category === "gate") this._drawGate(p.z, p.isFinish);
			else if (p.category === "prop") r.drawProp(p.o);
			else r.drawSprite(p.z, p.x, (c, sx, sy, scale) => {
				this._drawCar(c, {
					sx,
					sy,
					scale
				}, p.kind, p.o);
			});
			if (this.mode !== MODE.ATTRACT) this._drawPlayer(ctx);
			r.endFrame();
		}
		_drawSpeedLines(ctx, p) {
			const cx = 160;
			const cy = 80;
			const n = Math.round(10 + 12 * p);
			ctx.save();
			ctx.beginPath();
			ctx.rect(0, 40, 320, 160);
			ctx.clip();
			for (let i = 0; i < n; i++) {
				const a = i * 2.39996 % (Math.PI * 2);
				const dx = Math.cos(a), dy = Math.sin(a) * .55;
				const ph = (this.t * (2.2 + 1.8 * p) + i * .137) % 1;
				const r0 = 14 + ph * 190;
				const len = (8 + 34 * p) * (.35 + ph);
				const x0 = cx + dx * r0, y0 = cy + dy * r0;
				const x1 = cx + dx * (r0 + len), y1 = cy + dy * (r0 + len);
				if (y0 > 200 && y1 > 200) continue;
				ctx.globalAlpha = Math.min(1, p * (.25 + .75 * ph));
				ctx.fillStyle = i % 3 === 0 ? P.chargeHigh : "#ffffff";
				const steps = Math.max(1, Math.round(Math.hypot(x1 - x0, y1 - y0) / 2));
				for (let k = 0; k <= steps; k++) {
					const t = k / steps;
					ctx.fillRect(Math.round(x0 + (x1 - x0) * t), Math.round(y0 + (y1 - y0) * t), p > .6 ? 2 : 1, p > .6 ? 2 : 1);
				}
			}
			ctx.globalAlpha = 1;
			ctx.restore();
		}
		_drawGate(z, isFinish) {
			const ctx = this.ctx;
			const a = this.renderer.project(z, -1.25, 0);
			const b = this.renderer.project(z, 1.25, 0);
			if (!a || !b || !a.visible || !b.visible) return;
			const h = Math.max(6, 7 * a.scale);
			const w = Math.max(2, .5 * a.scale);
			ctx.save();
			ctx.beginPath();
			ctx.rect(0, 40, 320, Math.max(0, a.clip - 40));
			ctx.clip();
			ctx.fillStyle = isFinish ? P.gateGlow : P.gate;
			ctx.fillRect(Math.round(a.sx - w / 2), Math.round(a.sy - h), Math.max(1, Math.round(w)), Math.round(h));
			ctx.fillRect(Math.round(b.sx - w / 2), Math.round(b.sy - h), Math.max(1, Math.round(w)), Math.round(h));
			const beamH = Math.max(2, h * .16);
			ctx.fillRect(Math.round(a.sx), Math.round(a.sy - h), Math.round(b.sx - a.sx), Math.round(beamH));
			if (a.scale > 3) {
				const label = isFinish ? "FINISH" : "CHECK";
				const px = Math.max(1, Math.round(a.scale * .35));
				drawTextCentered(ctx, label, (a.sx + b.sx) / 2, Math.round(a.sy - h + beamH + px), px, P.hudBg);
			}
			ctx.restore();
		}
		_drawCar(ctx, pr, kind, o) {
			const w = Math.max(2, Math.round(CAR_WIDTH * pr.scale));
			const h = Math.max(2, Math.round(CAR_WIDTH * .61 * pr.scale));
			const x = Math.round(pr.sx - w / 2);
			const y = Math.round(pr.sy - h);
			const body = kind === "rival" ? P.rivalBody : P.trafficBody;
			const roof = kind === "rival" ? P.rivalRoof : P.trafficRoof;
			ctx.fillStyle = "#101018";
			ctx.fillRect(x, y + h - Math.max(1, h * .18), w, Math.max(1, Math.round(h * .18)));
			ctx.fillStyle = body;
			ctx.fillRect(x, y + Math.round(h * .3), w, Math.round(h * .55));
			ctx.fillStyle = roof;
			ctx.fillRect(x + Math.round(w * .22), y, Math.round(w * .56), Math.round(h * .42));
			if (kind === "rival" && o && o.lamp > 0) {
				ctx.fillStyle = P.rivalLamp;
				const lw = Math.max(1, Math.round(w * .18));
				const lh = Math.max(1, Math.round(h * .22));
				ctx.fillRect(x + 1, y + Math.round(h * .34), lw, lh);
				ctx.fillRect(x + w - 1 - lw, y + Math.round(h * .34), lw, lh);
			}
		}
		spinYaw() {
			const s = this.sim;
			if (s.spin <= 0) return 0;
			return (1 - s.spin / HIT.spinTime) * Math.PI * 2 * SPIN_VIS.turns;
		}
		_drawScrub(ctx) {
			if (!this.scrub.length) return;
			const V = SPIN_VIS;
			for (const m of this.scrub) {
				const p = this.renderer.project(m.z, m.x, 0);
				if (!p || !p.visible || !(p.scale > 0)) continue;
				if (m.puff) {
					const a = m.age / V.puffLife;
					const rM = .3 + .5 * a;
					const rw = Math.max(1, Math.round(rM * p.scale));
					const rh = Math.max(1, Math.round(rM * .55 * p.scale));
					const rise = V.puffRiseM * a * p.scale;
					ctx.globalAlpha = .34 * (1 - a);
					ctx.fillStyle = "#d8d8e4";
					ctx.fillRect(Math.round(p.sx - rw), Math.round(p.sy - rise - rh), rw * 2, rh * 2);
				} else {
					const a = m.age / V.scrubLife;
					const mw = Math.max(1, Math.round(V.scrubFrac * CAR_WIDTH * p.scale));
					const mh = Math.max(1, Math.round(.25 * p.scale));
					ctx.globalAlpha = .55 * (1 - a);
					ctx.fillStyle = "#1a1a22";
					ctx.fillRect(Math.round(p.sx - mw / 2), Math.round(p.sy - mh), mw, mh);
				}
			}
			ctx.globalAlpha = 1;
		}
		_drawPlayer(ctx) {
			const s = this.sim;
			const p = this.renderer.project(s.z, s.x, 0);
			const pxPerM = p.scale;
			const cx = p.sx;
			const bob = Math.sin(this.t * 22) * (s.speed / 100) * .9;
			const w = Math.max(8, Math.round(CAR_WIDTH * pxPerM));
			const h = Math.max(4, Math.round(CAR_WIDTH * .61 * pxPerM));
			const y = Math.round(p.sy - h + bob + (s.boost.active ? 1.5 : 0));
			const x = Math.round(cx - w / 2);
			if (s.zoneLevel > 0) {
				const depth = s.zone === "deep" ? s.zoneDepth || 0 : 0;
				ctx.globalAlpha = .1 + .16 * s.zoneLevel + .2 * depth;
				ctx.fillStyle = "#d0e0ff";
				const bands = 5 + Math.round(3 * depth);
				for (let i = 0; i < bands; i++) {
					const yy = y - 26 - i * 5 + Math.sin(this.t * (9 + 6 * depth) + i) * 2;
					ctx.fillRect(x - 8 + Math.sin(this.t * 6 + i * 1.7) * 4, yy, w + 16, 2);
				}
				ctx.globalAlpha = 1;
			}
			if (s.boost.active || this.boostKick > 0) {
				const e = Math.max(this.boostEnv, this.boostKick);
				const n = Math.round(7 + 7 * e);
				for (let i = 0; i < n; i++) {
					const t = i / n;
					const sw = Math.round(w * (1 - t) * (.8 + .7 * e));
					ctx.fillStyle = t < .35 ? "#ffffff" : s.boost.sling ? P.chargeHigh : "#ff8840";
					ctx.globalAlpha = (.55 + .45 * e) * (1 - t);
					ctx.fillRect(Math.round(cx - sw / 2), y + h - 2 + i * 3, sw, 2);
				}
				ctx.globalAlpha = 1;
			}
			if (s.spin > 0) {
				const V = SPIN_VIS;
				const psi = this.spinYaw();
				const cs = Math.cos(psi), sn = Math.sin(psi);
				const acs = Math.abs(cs), asn = Math.abs(sn);
				const hw = CAR_WIDTH / 2, hl = CAR_LEN / 2;
				const px = (f) => Math.round(w * f);
				const py = (f) => Math.round(h * f);
				const tyre = Math.max(2, py(.24));
				const sill = y + h - tyre;
				const den = Math.max(1e-6, hw * acs + hl * asn);
				const nrm = (u, v) => (u * cs + v * sn) / den;
				const dep = (u, v) => -u * sn + v * cs;
				const place = (u, v, fw) => Math.min(x + w - fw, Math.max(x, Math.round(cx + nrm(u, v) * (w - fw) / 2 - fw / 2)));
				const pFar = this.renderer.project(s.z + .5, s.x, 0);
				const pNear = this.renderer.project(s.z - .5, s.x, 0);
				const gpm = (pFar && pNear ? Math.max(.5, pNear.sy - pFar.sy) : pxPerM * .4) * V.groundSquash;
				const dM = acs * CAR_LEN + asn * CAR_WIDTH;
				const footPx = Math.max(2, Math.round(dM * gpm));
				ctx.globalAlpha = .5;
				ctx.fillStyle = "#000008";
				ctx.fillRect(x - px(.04), sill + tyre - footPx, w + px(.08), footPx);
				ctx.globalAlpha = 1;
				const hu = V.trackFrac * hw;
				const hv = V.wheelbaseFrac * hl;
				const wpx = Math.max(2, Math.round(V.wheelM * pxPerM));
				const wpy = Math.max(1, Math.round(V.wheelM * gpm));
				const wheels = [];
				for (const u of [-hu, hu]) for (const v of [-hv, hv]) wheels.push({
					sx: place(u, v, wpx),
					dz: dep(u, v)
				});
				wheels.sort((a, b) => b.dz - a.dz);
				const drawWheel = (wl) => {
					ctx.fillStyle = wl.dz > 0 ? "#7a8296" : "#eef0f6";
					ctx.fillRect(wl.sx, Math.round(sill + tyre - footPx / 2 - wpy / 2 - wl.dz * gpm), wpx, wpy);
				};
				for (const wl of wheels) if (wl.dz > 0) drawWheel(wl);
				const bodyTop = y + py(.26);
				ctx.fillStyle = P.playerBody;
				ctx.fillRect(x, bodyTop, w, sill - bodyTop);
				ctx.fillStyle = P.playerShade;
				ctx.fillRect(x, sill - Math.max(1, py(.12)), w, Math.max(1, py(.12)));
				const cabV = -.5 * CAR_LEN * (1 - V.roofLenFrac);
				const roofW = Math.max(3, Math.round(V.roofWidFrac * CAR_WIDTH * pxPerM));
				const roofX = place(0, cabV, roofW);
				ctx.fillStyle = P.playerBody;
				ctx.fillRect(roofX, bodyTop, roofW, sill - bodyTop);
				ctx.fillStyle = P.playerRoof;
				ctx.fillRect(roofX, y, roofW, py(.32));
				const glassW = Math.max(2, roofW - Math.max(2, px(.06)));
				ctx.fillStyle = cs < -.35 ? "#203048" : "#101018";
				ctx.fillRect(roofX + Math.round((roofW - glassW) / 2), y + Math.max(1, py(.06)), glassW, Math.max(1, py(.18)));
				const lampA = Math.min(1, Math.max(0, (acs - V.lampOff) / V.lampFade));
				if (lampA > .02) {
					const lampV = cs > 0 ? -2.2 : hl;
					const lw = Math.max(1, px(.16));
					ctx.globalAlpha = lampA;
					ctx.fillStyle = cs > 0 ? "#e84030" : "#fff0c0";
					for (const side of [-1, 1]) ctx.fillRect(place(side * V.lampUFrac * hw, lampV, lw), y + py(.4), lw, py(.16));
					ctx.globalAlpha = 1;
				}
				for (const wl of wheels) if (wl.dz <= 0) drawWheel(wl);
				return;
			}
			const px = (f) => Math.round(w * f);
			const py = (f) => Math.round(h * f);
			const tyre = Math.max(2, py(.24));
			const sill = y + h - tyre;
			ctx.fillStyle = "#101018";
			ctx.fillRect(x - px(.05), sill, w + px(.1), tyre);
			ctx.fillStyle = "#e0e0e8";
			ctx.fillRect(x - px(.05), sill, px(.16), tyre);
			ctx.fillRect(x + w - px(.11), sill, px(.16), tyre);
			ctx.fillStyle = P.playerBody;
			ctx.fillRect(x, y + py(.26), w, h - py(.26) - tyre);
			ctx.fillStyle = P.playerShade;
