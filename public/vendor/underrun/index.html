<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,follow" />
    <link
      rel="canonical"
      href="https://games.iamdenny.com/vendor/underrun/"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'"
    />
    <title>UNDERRUN · Denny Games</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
        touch-action: none;
      }
      #c {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }
      #a {
        position: absolute;
        inset: 4% 2% auto;
        width: 94%;
        overflow: hidden;
        color: #c80;
        font: bold 1.6vw/1.3 monospace;
        white-space: pre-wrap;
        text-shadow: 0 0 7px #f70;
      }
      #a div:last-child {
        color: #e90;
      }
      #a b {
        animation: blink 1s infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <canvas
      id="c"
      width="320"
      height="180"
      role="img"
      aria-label="UNDERRUN 3D shooter game canvas"
    ></canvas>
    <code id="a" aria-live="polite"></code>
    <script src="./engine.js"></script>
    <script src="./assets.js"></script>
    <script src="./bridge.js"></script>
    <script src="./main.js"></script>
  </body>
</html>
